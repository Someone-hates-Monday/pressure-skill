[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pressure-skill"
version = "0.1.0"
description = "沟通画像与压力场景下的得体回复建议（MVP）"
keywords = [
  "cursor",
  "agent-skills",
  "cursor-skills",
  "claude-code",
  "openclaw",
  "fastapi",
  "workplace-communication",
  "negotiation",
  "communication",
  "llm",
  "litellm",
  "reply-templates",
  "zh-en",
  "skill-md",
  "pressure",
  "boundaries",
  "pushback",
  "say-no",
  "anti-gaslighting",
  "gaslighting",
  "workplace-toxic",
  "difficult-conversations",
  "soft-rejection",
  "deadline-anxiety",
  "拒绝被压力",
  "职场边界",
  "反PUA",
  "workplace-replies",
  "sendable-replies",
  "deadline-pushback",
  "vague-requirements",
  "counterparty-profile",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pressure.skill contributors" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Someone-hates-Monday/pressure-skill"
Repository = "https://github.com/Someone-hates-Monday/pressure-skill"
Issues = "https://github.com/Someone-hates-Monday/pressure-skill/issues"

[project.optional-dependencies]
llm = ["litellm>=1.40"]
ui = ["streamlit>=1.28"]
dev = ["pytest>=8.0", "httpx>=0.27", "litellm>=1.40", "streamlit>=1.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pressure_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
